name: 构建安装包

on:
  workflow_dispatch:
    inputs:
      ref:
        description: 要构建的分支、tag 或提交（留空则用上面选中的分支）
        required: false
        default: ''
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: build-${{ github.event.pull_request.number || inputs.ref || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS (universal)
            os: macos-latest
            rust-targets: aarch64-apple-darwin x86_64-apple-darwin
            args: --target universal-apple-darwin --bundles dmg
            artifact: SimpleTodo-macos-universal
            path: src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
          - name: Windows (x64)
            os: windows-latest
            rust-targets: x86_64-pc-windows-msvc
            args: --bundles nsis
            artifact: SimpleTodo-windows-x64
            path: src-tauri/target/release/bundle/nsis/*.exe

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      # runner 镜像自带 rustup，只补齐需要的编译目标
      - name: 安装 Rust 编译目标
        run: rustup target add ${{ matrix.rust-targets }}

      - run: npm ci

      - name: 构建安装包
        run: npm run tauri build -- ${{ matrix.args }}

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.path }}
          if-no-files-found: error
