<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#60a5fa"/>
      <stop offset="1" stop-color="#2563eb"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="14"/>
      <feOffset dy="10" result="blur"/>
      <feFlood flood-color="#000" flood-opacity="0.25"/>
      <feComposite in2="blur" operator="in"/>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <!-- 底板 -->
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#bg)" filter="url(#shadow)"/>
  <!-- 毛玻璃卡片 -->
  <rect x="210" y="230" width="604" height="564" rx="72" fill="#fff" opacity="0.92"/>
  <!-- 加急任务 -->
  <circle cx="300" cy="360" r="34" fill="#f59e0b"/>
  <polygon points="306,332 282,364 298,364 292,388 318,354 302,354" fill="#fff"/>
  <rect x="364" y="340" width="340" height="40" rx="20" fill="#f59e0b" opacity="0.45"/>
  <!-- 已完成任务 -->
  <circle cx="300" cy="512" r="34" fill="#52c41a"/>
  <path d="M 284 512 L 296 524 L 318 500" fill="none" stroke="#fff" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="364" y="492" width="280" height="40" rx="20" fill="#d1d5db"/>
  <!-- 待办任务 -->
  <circle cx="300" cy="664" r="30" fill="none" stroke="#94a3b8" stroke-width="10"/>
  <rect x="364" y="644" width="360" height="40" rx="20" fill="#94a3b8" opacity="0.55"/>
</svg>
